# static-web-server configuration for the container that serves explorables.kphutt.com.
# https://static-web-server.net -- v3, the image the Dockerfile pins by version and digest.
#
# Explorables are standalone interactive pages: their own JavaScript, SVG, styles, images
# and fonts, from pages/. They live on their own origin so that kphutt.com keeps
# script-src 'none'. A page here can run its own scripts, and nothing it does can reach the
# site's pages, because a browser keeps the two origins apart.
#
# THE SECURITY HEADERS BELOW ARE A POLICY, NOT TUNING. scripts/check.py reads
# this file and fails the build if the Content-Security-Policy is weaker than its floor on
# any directive, if HSTS loses includeSubDomains or gains preload, if a required header goes
# missing, if a cache rule turns immutable, or if anything here would keep a page out of
# search results. scripts/smoke.py checks a running server sends exactly these values.

[general]
host = "0.0.0.0"
port = 8080
root = "/public"

# Cloud Run already logs every request.
log-level = "warn"

# pages/404.html. Without it the server would fall back to its built-in page, whose
# inline <style> the CSP blocks. scripts/check.py requires the file and this line, and
# scripts/smoke.py checks it is this page that comes back.
page404 = "404.html"

# Off: the explicit headers below replace them. The built-in security headers would add HSTS
# with preload, and the built-in cache rules a one-year cache on names that never change.
security-headers = false
cache-control-headers = false

# Gzip, Brotli or Zstandard, as the browser asks, for the server's text types: HTML, CSS,
# JavaScript, SVG, XML and plain text. Fonts are already compressed (woff2). The gate requires
# it, and scripts/smoke.py checks each type comes back compressed.
compression = true
# v3 can also serve pre-compressed .gz/.br/.zst files found beside the originals. None are
# built here, so it stays off, as in v2.
compression-static = false
directory-listing = false
# Nothing here needs a dot-file, so none is served. scripts/check.py also fails
# the build if one is in the output.
# v3 names: include-hidden replaces v2's ignore-hidden-files (inverted), and follow-symlinks
# replaces disable-symlinks (inverted). v3 only warns on a key it does not know, so an old name
# would silently fall back to the default; scripts/check.py requires the new one.
include-hidden = false
follow-symlinks = false

# /<slug> redirects to /<slug>/, so a page's relative links resolve inside its folder.
redirect-trailing-slash = true
index-files = "index.html"

[advanced]

# Headers are applied in order, and a later match replaces an earlier value, so the
# catch-all comes first and the narrower Cache-Control rule after it.

# Every response, including the 404 page.
[[advanced.headers]]
source = "**"
[advanced.headers.headers]
# kphutt.com's policy, with these changes: script-src 'self' so a page can run its own script
# files, font-src 'self' for bundled fonts, and Trusted Types with no policy allowed
# (require-trusted-types-for 'script' plus trusted-types 'none'), so no script can hand a
# string to innerHTML or an eval-like sink. connect-src 'none' says outright that fetch,
# XHR, WebSocket and beacons are blocked, so a page cannot call any API, this one included.
# upgrade-insecure-requests turns any stray http:// load into https://. Still no
# 'unsafe-inline', no hashes, no nonces and no other origin. Setting styles through the
# CSSOM (element.style) is allowed by style-src 'self'; a style= attribute is not.
Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'; upgrade-insecure-requests"
# Two years, with includeSubDomains: it covers only names under explorables.kphutt.com,
# none of which exist or are planned. Deliberately no preload. The preload list only takes
# an apex domain, so asking for it here would mean preloading kphutt.com and every name under
# it, which kphutt.com does not do.
Strict-Transport-Security = "max-age=63072000; includeSubDomains"
X-Content-Type-Options = "nosniff"
# Nothing a page links to learns which explorable sent the visitor.
Referrer-Policy = "no-referrer"
# The same list as kphutt.com sends. scripts/check.py pins it (PERMISSIONS_POLICY).
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
# Every resource must be same-origin or opt in to being embedded. Everything here is
# same-origin, so nothing breaks, and the page is cross-origin isolated.
Cross-Origin-Embedder-Policy = "require-corp"
# frame-ancestors 'none' already forbids framing. This says the same to older browsers.
X-Frame-Options = "DENY"
# No X-Robots-Tag: explorables are meant to be found in search. The build generates
# robots.txt and sitemap.xml, and only the 404 page carries a noindex meta tag.
# File names here do not change when their content does, so everything stays short.
Cache-Control = "public, max-age=300"

# sitemap.xml. The server's default for .xml is text/xml; application/xml is the type
# registered for XML documents, as on kphutt.com.
[[advanced.headers]]
source = "/sitemap.xml"
headers.Content-Type = "application/xml"

# Bundled fonts and favicon.svg: files whose names carry no content hash, so a new version
# keeps the old name. 30 days, which is long enough for Lighthouse's static-asset check, and
# safe: a returning visitor may see the old font or icon for up to a month after a change,
# and both are only cosmetic. Never immutable, which promises a name's content never changes;
# that is only true of hashed names. To ship a font change at once, give the file a new name.
[[advanced.headers]]
source = "**/*.{woff2,woff}"
headers.Cache-Control = "public, max-age=2592000"

[[advanced.headers]]
source = "**/favicon.svg"
headers.Cache-Control = "public, max-age=2592000"
